<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="850" height="180">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="snake-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>

    <!-- Glass Surface Gradient -->
    <linearGradient id="snake-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Header Sweep Line -->
    <linearGradient id="snake-sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#3B82F6;#A855F7;#EC4899;#10B981;#22D3EE" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#3B82F6">
        <animate attributeName="stop-color" values="#3B82F6;#A855F7;#EC4899;#10B981;#22D3EE;#3B82F6" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#A855F7">
        <animate attributeName="stop-color" values="#A855F7;#EC4899;#10B981;#22D3EE;#3B82F6;#A855F7" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Neon Glow Filter for Snake Head -->
    <filter id="head-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="dot-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    text {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    .mono {
      font-family: 'Fira Code', 'Courier New', monospace;
    }

    /* Keyframe Animations */
    @keyframes snakeHeadMove {
      0%   { transform: translate(45px, 60px); }
      15%  { transform: translate(210px, 60px); }
      25%  { transform: translate(210px, 90px); }
      40%  { transform: translate(420px, 90px); }
      50%  { transform: translate(420px, 135px); }
      65%  { transform: translate(650px, 135px); }
      75%  { transform: translate(650px, 75px); }
      88%  { transform: translate(790px, 75px); }
      100% { transform: translate(45px, 60px); }
    }

    @keyframes snakeBody1 {
      0%   { transform: translate(30px, 60px); }
      15%  { transform: translate(195px, 60px); }
      25%  { transform: translate(210px, 75px); }
      40%  { transform: translate(405px, 90px); }
      50%  { transform: translate(420px, 120px); }
      65%  { transform: translate(635px, 135px); }
      75%  { transform: translate(650px, 90px); }
      88%  { transform: translate(775px, 75px); }
      100% { transform: translate(30px, 60px); }
    }

    @keyframes snakeBody2 {
      0%   { transform: translate(15px, 60px); }
      15%  { transform: translate(180px, 60px); }
      25%  { transform: translate(210px, 60px); }
      40%  { transform: translate(390px, 90px); }
      50%  { transform: translate(420px, 105px); }
      65%  { transform: translate(620px, 135px); }
      75%  { transform: translate(650px, 105px); }
      88%  { transform: translate(760px, 75px); }
      100% { transform: translate(15px, 60px); }
    }

    @keyframes pulseEnergy {
      0%, 100% { opacity: 0.8; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.25); }
    }

    @keyframes dotEatEffect {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; fill: #EC4899; }
    }

    .snake-head { animation: snakeHeadMove 12s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .snake-body-1 { animation: snakeBody1 12s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .snake-body-2 { animation: snakeBody2 12s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    
    .pulse-dot { animation: pulseEnergy 2.5s ease-in-out infinite; }
    .eat-dot { animation: dotEatEffect 3.2s ease-in-out infinite; }
  </style>

  <!-- Main Canvas Surface -->
  <rect width="100%" height="100%" fill="url(#snake-bg)" rx="14"/>
  <rect x="10" y="10" width="830" height="160" rx="10" fill="url(#snake-glass)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Top Accent Sweep Line -->
  <rect x="25" y="10" width="180" height="2" fill="url(#snake-sweep)" rx="1"/>

  <!-- Header Section -->
  <g transform="translate(25, 20)">
    <circle cx="6" cy="12" r="4" fill="#67E8F9" filter="url(#dot-glow)"/>
    <text x="18" y="16" fill="#F8FAFC" font-size="11" font-weight="700" letter-spacing="0.8">CONTRIBUTION MATRIX <tspan fill="#67E8F9" font-weight="500">// CYBERNETIC SNAKE ENGINE</tspan></text>
    <text x="795" y="16" text-anchor="end" fill="#A855F7" font-size="10" font-weight="600" class="mono">RAGHUVARAN LOKATI • 2,450+ COMMITS</text>
  </g>

