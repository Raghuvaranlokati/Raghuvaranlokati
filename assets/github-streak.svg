<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 150" width="850" height="150">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="strk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>

    <!-- Glass Surface Gradient -->
    <linearGradient id="strk-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Shimmer Top Accent -->
    <linearGradient id="strk-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Flame & Trophy Orbs -->
    <linearGradient id="flame-orb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>

    <linearGradient id="contrib-orb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="longest-orb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="strk-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    text { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .mono { font-family: 'Fira Code', monospace; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#strk-bg)" rx="12"/>
  <rect x="8" y="8" width="834" height="134" rx="10" fill="url(#strk-glass)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Top Accent Bar -->
  <rect x="25" y="8" width="160" height="2" fill="url(#strk-accent)" rx="1"/>

  <!-- Header -->
  <text x="25" y="26" fill="#F8FAFC" font-size="11.5" font-weight="700" letter-spacing="0.8">GITHUB STREAKS &amp; CONTINUOUS CONTRIBUTION ENGINE</text>
  <text x="825" y="26" text-anchor="end" fill="#F59E0B" font-size="10" font-weight="600" class="mono">🔥 SYSTEM ACTIVE</text>

  <!-- 3 Main Streak Pillars -->
  <!-- 1. Total Contributions -->
  <g transform="translate(25, 42)">
    <rect width="250" height="86" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
    <circle cx="36" cy="43" r="20" fill="url(#contrib-orb)"/>
    <text x="36" y="50" text-anchor="middle" fill="#FFF" font-size="18">📈</text>
    <text x="70" y="38" fill="#F8FAFC" font-size="22" font-weight="900" class="mono">830+</text>
    <text x="70" y="56" fill="#94A3B8" font-size="10.5" font-weight="600">Total Contributions</text>
    <text x="70" y="70" fill="#22D3EE" font-size="9" font-weight="600" class="mono">All-Time Activity</text>
  </g>

  <!-- 2. Current Streak (Middle - Fire Accent) -->
  <g transform="translate(300, 42)">
    <rect width="250" height="86" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5" filter="url(#strk-glow)"/>
    <circle cx="36" cy="43" r="20" fill="url(#flame-orb)"/>
    <text x="36" y="50" text-anchor="middle" fill="#FFF" font-size="20">🔥</text>
    <text x="70" y="38" fill="#F8FAFC" font-size="22" font-weight="900" class="mono">14 Days</text>
    <text x="70" y="56" fill="#F59E0B" font-size="10.5" font-weight="700">Current Streak</text>
    <text x="70" y="70" fill="#CBD5E1" font-size="9" font-weight="600" class="mono">Continuous Commits</text>
  </g>

  <!-- 3. Longest / Highest Streak -->
  <g transform="translate(575, 42)">
    <rect width="250" height="86" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
    <circle cx="36" cy="43" r="20" fill="url(#longest-orb)"/>
    <text x="36" y="50" text-anchor="middle" fill="#FFF" font-size="18">⚡</text>
    <text x="70" y="38" fill="#F8FAFC" font-size="22" font-weight="900" class="mono">42 Days</text>
    <text x="70" y="56" fill="#94A3B8" font-size="10.5" font-weight="600">Highest Streak</text>
    <text x="70" y="70" fill="#10B981" font-size="9" font-weight="600" class="mono">Personal Best Record</text>
  </g>
</svg>
