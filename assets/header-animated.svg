<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 200" width="850" height="200">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="hdr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="40%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>

    <!-- Glass Surface Gradient -->
    <linearGradient id="hdr-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Animated Shimmer Gradient for Title -->
    <linearGradient id="title-sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67E8F9">
        <animate attributeName="stop-color" values="#67E8F9;#3B82F6;#A855F7;#EC4899;#10B981;#67E8F9" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#3B82F6">
        <animate attributeName="stop-color" values="#3B82F6;#A855F7;#EC4899;#10B981;#67E8F9;#3B82F6" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#A855F7">
        <animate attributeName="stop-color" values="#A855F7;#EC4899;#10B981;#67E8F9;#3B82F6;#A855F7" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Top Shimmer Border -->
    <linearGradient id="border-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="hdr-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="dot-pulse" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    text {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    .mono {
      font-family: 'Fira Code', 'Courier New', monospace;
    }

    /* Keyframe Animations */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.12; }
      50% { transform: scale(1.3); opacity: 0.22; }
    }

    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) scale(0.9); opacity: 0.2; }
      50% { transform: translateY(-8px) scale(1.2); opacity: 0.8; }
    }

    @keyframes statusGlint {
      0%, 100% { fill: #22D3EE; }
      50% { fill: #10B981; }
    }

    .orb-1 { animation: pulseOrb 6s ease-in-out infinite; transform-origin: 150px 100px; }
    .orb-2 { animation: pulseOrb 7s ease-in-out infinite 1.5s; transform-origin: 700px 120px; }
    .orb-3 { animation: pulseOrb 8s ease-in-out infinite 3s; transform-origin: 425px 150px; }

    .pt-1 { animation: floatParticle 4s ease-in-out infinite 0s; }
    .pt-2 { animation: floatParticle 5s ease-in-out infinite 1.2s; }
    .pt-3 { animation: floatParticle 3.8s ease-in-out infinite 2.1s; }

    .status-dot { animation: statusGlint 3s ease-in-out infinite; }
  </style>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#hdr-bg)" rx="16"/>

  <!-- Glowing Ambient Orbs -->
  <circle cx="150" cy="100" r="140" fill="#22D3EE" class="orb-1" filter="blur(45px)"/>
  <circle cx="700" cy="120" r="150" fill="#A855F7" class="orb-2" filter="blur(50px)"/>
  <circle cx="425" cy="150" r="130" fill="#3B82F6" class="orb-3" filter="blur(40px)"/>

  <!-- Shimmering Particles -->
  <circle cx="60" cy="40" r="2" fill="#22D3EE" class="pt-1"/>
  <circle cx="780" cy="50" r="2.5" fill="#A855F7" class="pt-2"/>
  <circle cx="400" cy="30" r="1.5" fill="#3B82F6" class="pt-3"/>

  <!-- Glass Surface Frame -->
  <rect x="12" y="12" width="826" height="176" rx="12" fill="url(#hdr-glass)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Top Shimmer Line -->
  <rect x="30" y="12" width="220" height="2" fill="url(#border-shimmer)" rx="1"/>

  <!-- Header Content Stack -->
  <!-- 1. Status Pill -->
  <g transform="translate(30, 26)">
    <rect width="175" height="24" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
    <circle cx="14" cy="12" r="4" class="status-dot" filter="url(#dot-pulse)"/>
    <text x="24" y="16" fill="#F8FAFC" font-size="9.5" font-weight="700" letter-spacing="0.5">SYSTEM ONLINE</text>
    <text x="108" y="16" fill="#67E8F9" font-size="9" font-weight="600" class="mono">// v2.0</text>
  </g>

  <!-- 2. Main Title: LOKATI RAGHUVARAN -->
  <g transform="translate(425, 110)">
    <text x="0" y="0" text-anchor="middle" fill="url(#title-sweep)" font-size="46" font-weight="900" letter-spacing="2.5" filter="url(#hdr-glow)">LOKATI RAGHUVARAN</text>
  </g>

  <!-- 3. Subtitle Badge: AI OS -->
  <g transform="translate(425, 150)">
    <rect x="-195" y="-14" width="390" height="26" rx="13" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
    <text x="0" y="3" text-anchor="middle" fill="#E2E8F0" font-size="12" font-weight="700" letter-spacing="0.8">AI OS — The Operating System for Artificial Intelligence</text>
  </g>
</svg>
