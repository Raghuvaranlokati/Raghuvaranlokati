name: Auto Update GitHub Streaks & Stats

on:
  schedule:
    - cron: "0 0 * * *" # Runs daily at midnight UTC
  workflow_dispatch:     # Allows manual trigger anytime from the Actions tab
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-stats.yml"
      - "scripts/update_stats.py"

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run Stats Updater
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          python scripts/update_stats.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/github-streak.svg assets/github-stats.svg
          if git diff --staged --quiet; then
            echo "No changes in statistics to commit."
          else
            git commit -m "chore(stats): auto-update GitHub streak & profile stats [skip ci]"
            git push
          fi
