    <rect x="0" y="15" width="11" height="11" rx="2" fill="#00F2FE" opacity="0.6"/>
    <rect x="0" y="30" width="11" height="11" rx="2" fill="#0F172A" stroke="#1E293B" stroke-width="0.8"/>
    <rect x="0" y="45" width="11" height="11" rx="2" fill="#3B82F6"/>
    <rect x="0" y="60" width="11" height="11" rx="2" fill="#A855F7"/>
