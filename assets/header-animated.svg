<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 140" width="850" height="140">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="hdr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="40%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>

    <!-- Glass Surface Gradient -->
    <linearGradient id="hdr-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Animated Shimmer Gradient for Title -->
    <linearGradient id="title-sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67E8F9">
        <animate attributeName="stop-color" values="#67E8F9;#3B82F6;#A855F7;#EC4899;#10B981;#67E8F9" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#3B82F6">
        <animate attributeName="stop-color" values="#3B82F6;#A855F7;#EC4899;#10B981;#67E8F9;#3B82F6" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#A855F7">
        <animate attributeName="stop-color" values="#A855F7;#EC4899;#10B981;#67E8F9;#3B82F6;#A855F7" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Animated Top Shimmer Border -->
    <linearGradient id="border-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#3B82F6;#A855F7;#EC4899;#22D3EE" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#3B82F6">
        <animate attributeName="stop-color" values="#3B82F6;#A855F7;#EC4899;#22D3EE;#3B82F6" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#A855F7">
        <animate attributeName="stop-color" values="#A855F7;#EC4899;#22D3EE;#3B82F6;#A855F7" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Specular Light Sheen for Title -->
    <linearGradient id="hdr-sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Text Mask for Specular Sheen Beam -->
    <mask id="text-mask">
      <text x="425" y="79" text-anchor="middle" fill="#ffffff" font-size="48" font-weight="900" letter-spacing="3" font-family="'Inter', system-ui, -apple-system, sans-serif">LOKATI RAGHUVARAN</text>
    </mask>

    <!-- Dynamic Breathing Neon Glow Filter -->
    <filter id="hdr-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur">
        <animate attributeName="stdDeviation" values="4;8;4" dur="3.2s" repeatCount="indefinite"/>
      </feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    text {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    .mono {
      font-family: 'Fira Code', 'Courier New', monospace;
    }

    /* Keyframe Animations */
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); opacity: 0.12; }
      50% { transform: scale(1.3); opacity: 0.22; }
    }

    .orb-1 { animation: pulseOrb 6s ease-in-out infinite; transform-origin: 150px 70px; }
    .orb-2 { animation: pulseOrb 7s ease-in-out infinite 1.5s; transform-origin: 700px 70px; }
    .orb-3 { animation: pulseOrb 8s ease-in-out infinite 3s; transform-origin: 425px 70px; }
  </style>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#hdr-bg)" rx="16"/>

  <!-- Glowing Ambient Orbs -->
  <circle cx="150" cy="70" r="120" fill="#22D3EE" class="orb-1" filter="blur(45px)"/>
  <circle cx="700" cy="70" r="130" fill="#A855F7" class="orb-2" filter="blur(50px)"/>
  <circle cx="425" cy="70" r="110" fill="#3B82F6" class="orb-3" filter="blur(40px)"/>

  <!-- Shimmering Particles with Native SMIL Twinkle & Float -->
  <circle cx="60" cy="35" r="2" fill="#22D3EE">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="35;27;35" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="780" cy="40" r="2.5" fill="#A855F7">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="4.2s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="40;30;40" dur="4.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="25" r="1.5" fill="#3B82F6">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="25;18;25" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="110" r="2" fill="#EC4899">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="110;102;110" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="105" r="1.8" fill="#10B981">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="105;97;105" dur="3.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Glass Surface Frame -->
  <rect x="12" y="12" width="826" height="116" rx="12" fill="url(#hdr-glass)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Cyberpunk HUD Corner Brackets -->
  <g stroke="#22D3EE" stroke-width="1.5" fill="none" opacity="0.6">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.5s" repeatCount="indefinite"/>
    <!-- Top-Left -->
    <path d="M 22 34 L 22 22 L 34 22"/>
    <!-- Bottom-Left -->
    <path d="M 22 106 L 22 118 L 34 118"/>
  </g>
  <g stroke="#A855F7" stroke-width="1.5" fill="none" opacity="0.6">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3.5s" repeatCount="indefinite"/>
    <!-- Top-Right -->
    <path d="M 828 34 L 828 22 L 816 22"/>
    <!-- Bottom-Right -->
    <path d="M 828 106 L 828 118 L 816 118"/>
  </g>

  <!-- Top Animated Laser Scanner Line -->
  <rect x="30" y="12" width="220" height="2" fill="url(#border-shimmer)" rx="1">
    <animate attributeName="x" values="30;590;30" dur="6.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Main Title: LOKATI RAGHUVARAN (Breathing Neon Aura) -->
  <g transform="translate(425, 79)">
    <text x="0" y="0" text-anchor="middle" fill="url(#title-sweep)" font-size="48" font-weight="900" letter-spacing="3" filter="url(#hdr-glow)">LOKATI RAGHUVARAN</text>
  </g>

  <!-- Specular Holographic Sheen Sweeping Across Name -->
  <rect x="0" y="30" width="160" height="70" fill="url(#hdr-sheen)" mask="url(#text-mask)" pointer-events="none">
    <animate attributeName="x" from="80" to="720" dur="4.2s" repeatCount="indefinite"/>
  </rect>
</svg>
