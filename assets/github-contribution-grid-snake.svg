    <text x="-12" y="12" fill="#64748B" font-size="8" font-weight="600" class="mono">Mon</text>
    <text x="-12" y="42" fill="#64748B" font-size="8" font-weight="600" class="mono">Wed</text>
    <text x="-12" y="72" fill="#64748B" font-size="8" font-weight="600" class="mono">Fri</text>

