<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="850" height="180">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="ph-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Glass Surface Gradient -->
    <linearGradient id="ph-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Accent Shimmer -->
    <linearGradient id="ph-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <filter id="ph-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    text {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    .mono {
      font-family: 'Fira Code', monospace;
    }
    .quote-text {
      font-style: italic;
    }
  </style>

  <rect width="100%" height="100%" fill="url(#ph-bg)" rx="14"/>
  <rect x="8" y="8" width="834" height="164" rx="12" fill="url(#ph-glass)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Left Accent Bar -->
  <rect x="8" y="24" width="4" height="132" fill="url(#ph-shimmer)" rx="2"/>

  <!-- Giant Glowing Quote Marks -->
  <text x="35" y="65" fill="#22D3EE" font-size="52" font-weight="900" opacity="0.3" filter="url(#ph-glow)">“</text>

  <!-- Quote Line 1 -->
  <text x="75" y="60" fill="#67E8F9" font-size="15" font-weight="700" class="mono">
    "Every downfall is the greatest time to comeback - 🗿👊"
  </text>

  <!-- Quote Line 2 -->
  <text x="75" y="88" fill="#F8FAFC" font-size="13.5" font-weight="600" class="quote-text">
    Great AI engineers don't just train models — they build &amp; ship intelligent systems.
  </text>

  <!-- Author Attribution Badge -->
  <g transform="translate(75, 125)">
    <rect width="320" height="24" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
    <circle cx="14" cy="12" r="4" fill="#22D3EE"/>
    <text x="26" y="16" fill="#67E8F9" font-size="10" font-weight="700" class="mono">LOKATI RAGHUVARAN</text>
    <text x="160" y="16" fill="#94A3B8" font-size="9" font-weight="600">// AI OS ARCHITECT</text>
  </g>
</svg>
