<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 140" width="850" height="140">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="ft-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>

    <!-- Glass Surface Gradient -->
    <linearGradient id="ft-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Shimmering Line Sweep -->
    <linearGradient id="ft-sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#3B82F6;#A855F7;#EC4899;#10B981;#22D3EE" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#3B82F6">
        <animate attributeName="stop-color" values="#3B82F6;#A855F7;#EC4899;#10B981;#22D3EE;#3B82F6" dur="7s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#A855F7">
        <animate attributeName="stop-color" values="#A855F7;#EC4899;#10B981;#22D3EE;#3B82F6;#A855F7" dur="7s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
  </defs>

  <style>
    text {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    .mono {
      font-family: 'Fira Code', 'Courier New', monospace;
    }

    @keyframes floatPulse {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }

    @keyframes glowGlint {
      0%, 100% { opacity: 0.6; filter: drop-shadow(0 0 2px rgba(34, 211, 238, 0.4)); }
      50% { opacity: 1; filter: drop-shadow(0 0 7px rgba(34, 211, 238, 0.9)); }
    }

    .p-1 { animation: floatPulse 3.5s ease-in-out infinite 0s; }
    .p-2 { animation: floatPulse 4.0s ease-in-out infinite 0.7s; }
    .p-3 { animation: floatPulse 3.8s ease-in-out infinite 1.4s; }
    .p-4 { animation: floatPulse 4.2s ease-in-out infinite 0.3s; }
    .p-5 { animation: floatPulse 3.6s ease-in-out infinite 1.1s; }

    .glow-glint { animation: glowGlint 3s ease-in-out infinite; }
  </style>

  <!-- Canvas Surface -->
  <rect width="100%" height="100%" fill="url(#ft-bg)" rx="14"/>
  <rect x="10" y="10" width="830" height="120" rx="10" fill="url(#ft-glass)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Top Shimmer Accent Line -->
  <rect x="25" y="10" width="180" height="2" fill="url(#ft-sweep)" rx="1"/>

  <!-- Header Title -->
  <g transform="translate(25, 20)">
    <circle cx="6" cy="12" r="4" fill="#22D3EE" class="glow-glint"/>
    <text x="18" y="16" fill="#F8FAFC" font-size="11" font-weight="700" letter-spacing="0.8">FEATURED TECHNOLOGIES &amp; CORE ENGINES</text>
    <text x="795" y="16" text-anchor="end" fill="#67E8F9" font-size="10" font-weight="600" class="mono">11 SPECS</text>
  </g>

  <!-- Row 1 Pills (y=48) -->
  <!-- 1. FastAPI -->
  <g class="p-1" transform="translate(25, 48)">
    <rect width="115" height="30" rx="15" fill="#0F172A" stroke="#059669" stroke-width="1.2"/>
    <circle cx="15" cy="15" r="7" fill="#059669"/>
    <text x="15" y="18" text-anchor="middle" fill="#FFF" font-size="8" font-weight="900">⚡</text>
    <text x="29" y="19" fill="#E2E8F0" font-size="11" font-weight="600">FastAPI</text>
  </g>

  <!-- 2. PyTorch -->
  <g class="p-2" transform="translate(150, 48)">
    <rect width="115" height="30" rx="15" fill="#0F172A" stroke="#EE4C2C" stroke-width="1.2"/>
    <circle cx="15" cy="15" r="7" fill="#EE4C2C"/>
    <text x="15" y="18" text-anchor="middle" fill="#FFF" font-size="8" font-weight="900">🔥</text>
    <text x="29" y="19" fill="#E2E8F0" font-size="11" font-weight="600">PyTorch</text>
  </g>

  <!-- 3. TensorFlow -->
  <g class="p-3" transform="translate(275, 48)">
    <rect width="125" height="30" rx="15" fill="#0F172A" stroke="#FF6F00" stroke-width="1.2"/>
    <circle cx="15" cy="15" r="7" fill="#FF6F00"/>
    <text x="15" y="18" text-anchor="middle" fill="#FFF" font-size="8" font-weight="900">🧠</text>
    <text x="29" y="19" fill="#E2E8F0" font-size="11" font-weight="600">TensorFlow</text>
  </g>

  <!-- 4. LangChain -->
  <g class="p-4" transform="translate(410, 48)">
    <rect width="120" height="30" rx="15" fill="#0F172A" stroke="#22D3EE" stroke-width="1.2"/>
    <text x="16" y="19" text-anchor="middle" fill="#FFF" font-size="10">🦜</text>
    <text x="29" y="19" fill="#E2E8F0" font-size="11" font-weight="600">LangChain</text>
  </g>

  <!-- 5. RAG -->
  <g class="p-5" transform="translate(540, 48)">
    <rect width="90" height="30" rx="15" fill="#0F172A" stroke="#A855F7" stroke-width="1.2"/>
    <circle cx="15" cy="15" r="7" fill="#A855F7"/>
    <text x="15" y="18" text-anchor="middle" fill="#FFF" font-size="8" font-weight="900">🔍</text>
    <text x="29" y="19" fill="#E2E8F0" font-size="11" font-weight="600">RAG</text>
  </g>

  <!-- 6. Vector Search -->
  <g class="p-1" transform="translate(640, 48)">
    <rect width="180" height="30" rx="15" fill="#0F172A" stroke="#3B82F6" stroke-width="1.2"/>
    <circle cx="15" cy="15" r="7" fill="#3B82F6"/>
    <text x="15" y="18" text-anchor="middle" fill="#FFF" font-size="8" font-weight="900">📐</text>
    <text x="29" y="19" fill="#E2E8F0" font-size="11" font-weight="600">Vector Search</text>
  </g>

  <!-- Row 2 Pills (y=88) -->
  <!-- 7. PostgreSQL -->
  <g class="p-2" transform="translate(25, 88)">
    <rect width="130" height="30" rx="15" fill="#0F172A" stroke="#4169E1" stroke-width="1.2"/>
    <circle cx="15" cy="15" r="7" fill="#4169E1"/>
    <text x="15" y="18" text-anchor="middle" fill="#FFF" font-size="8" font-weight="900">🐘</text>
    <text x="29" y="19" fill="#E2E8F0" font-size="11" font-weight="600">PostgreSQL</text>
  </g>

  <!-- 8. Redis -->
  <g class="p-3" transform="translate(165, 88)">
    <rect width="100" height="30" rx="15" fill="#0F172A" stroke="#DC382D" stroke-width="1.2"/>
    <circle cx="15" cy="15" r="7" fill="#DC382D"/>
    <text x="15" y="18" text-anchor="middle" fill="#FFF" font-size="8" font-weight="900">⚡</text>
    <text x="29" y="19" fill="#E2E8F0" font-size="11" font-weight="600">Redis</text>
  </g>

  <!-- 9. Kafka -->
  <g class="p-4" transform="translate(275, 88)">
    <rect width="105" height="30" rx="15" fill="#0F172A" stroke="#231F20" stroke="#22D3EE" stroke-width="1.2"/>
    <circle cx="15" cy="15" r="7" fill="#22D3EE"/>
    <text x="15" y="18" text-anchor="middle" fill="#000" font-size="8" font-weight="900">📡</text>
    <text x="29" y="19" fill="#E2E8F0" font-size="11" font-weight="600">Kafka</text>
  </g>

  <!-- 10. Docker -->
  <g class="p-5" transform="translate(390, 88)">
    <rect width="110" height="30" rx="15" fill="#0F172A" stroke="#2496ED" stroke-width="1.2"/>
    <circle cx="15" cy="15" r="7" fill="#2496ED"/>
    <text x="15" y="18" text-anchor="middle" fill="#FFF" font-size="8" font-weight="900">🐳</text>
    <text x="29" y="19" fill="#E2E8F0" font-size="11" font-weight="600">Docker</text>
  </g>

  <!-- 11. Kubernetes -->
  <g class="p-1" transform="translate(510, 88)">
    <rect width="140" height="30" rx="15" fill="#0F172A" stroke="#326CE5" stroke-width="1.2"/>
    <circle cx="15" cy="15" r="7" fill="#326CE5"/>
    <text x="15" y="18" text-anchor="middle" fill="#FFF" font-size="8" font-weight="900">☸️</text>
    <text x="29" y="19" fill="#E2E8F0" font-size="11" font-weight="600">Kubernetes</text>
  </g>
</svg>
